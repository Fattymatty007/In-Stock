<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/box.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5EF" />
    <meta name="description" content="Inventory, sales, and calendar manager" />
    <!-- iOS home-screen app -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="In Stock" />
    <title>In Stock</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    />
    <script>
      // Capture Chrome's install prompt as early as possible — it can fire
      // before the React app mounts, and if we miss it the in-app Install
      // button never appears.
      (function () {
        window.__deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          console.log('beforeinstallprompt fired', e);
          e.preventDefault();
          window.__deferredInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-install-available'));
        });
        window.addEventListener('appinstalled', function () {
          window.__deferredInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-installed'));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
